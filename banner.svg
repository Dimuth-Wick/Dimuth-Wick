<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc">
<title id="title">Hello, I'm Dimuth</title><desc id="desc">Animated profile banner with orbiting sparks.</desc>
<defs><pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#2a313d"/></pattern><radialGradient id="glow"><stop stop-color="#a984ee" stop-opacity=".35"/><stop offset="1" stop-color="#a984ee" stop-opacity="0"/></radialGradient><linearGradient id="planet"><stop stop-color="#c4a7ff"/><stop offset="1" stop-color="#946bdf"/></linearGradient></defs>
<rect width="1100" height="300" fill="#11151e"/><rect width="1100" height="300" fill="url(#dots)"/><circle cx="883" cy="149" r="185" fill="url(#glow)"/><rect x="31" y="27" width="1038" height="246" rx="20" fill="none" stroke="#46505d" stroke-width="2"/>
<text x="66" y="69" font-family="Consolas,monospace" font-size="19" fill="#d4f470">DIMUTH / GITHUB PROFILE</text><text x="64" y="178" font-family="Segoe UI,Arial,sans-serif" font-size="67" font-weight="700" fill="#f5f4ef">Hello, I'm Dimuth.</text><text x="67" y="228" font-family="Segoe UI,Arial,sans-serif" font-size="24" fill="#b9bec5">Building  ·  learning  ·  experimenting</text><rect x="67" y="253" width="190" height="4" rx="2" fill="#d4f470"/>
<circle cx="883" cy="149" r="91" fill="none" stroke="#5e6274" stroke-width="2"/><circle cx="883" cy="149" r="64" fill="none" stroke="#545a65" stroke-width="2"/><circle cx="883" cy="149" r="31" fill="url(#planet)"><animate attributeName="cy" values="149;145;149;153;149" dur="5s" repeatCount="indefinite"/></circle><g fill="#11151e"><circle cx="873" cy="144" r="2.5"/><circle cx="893" cy="144" r="2.5"/></g><path d="M873 155 Q883 165 893 155" fill="none" stroke="#11151e" stroke-width="2" stroke-linecap="round"/>
